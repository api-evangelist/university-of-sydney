  - aid: university-of-sydney:anypoint-gateway
    name: api.sydney.edu.au — MuleSoft Anypoint gateway (not publicly reachable)
    x-operator: institution
    x-access: network-restricted
    x-surface-class: APIGateway
    description: >-
      api.sydney.edu.au resolves in DNS to usyd-lb-p.lb.anypointdns.net — a MuleSoft Anypoint
      Platform dedicated load balancer named for the University of Sydney production environment —
      which is direct evidence that the institution runs an API management program. It is not a
      public one: TCP 443 is filtered on both advertised addresses, and HTTP and HTTPS requests
      time out rather than being refused. Recorded here as an institutional fact, not as a
      consumable surface. No documentation, portal, contract or credential process for it was found
      on any institution host.
    tags: [ API Gateway, MuleSoft, Anypoint, Internal, Network Restricted ]
  - aid: university-of-sydney:primo-alma
    name: Library Discovery — Ex Libris Primo VE / Alma (tenant)
    x-operator: tenant
    x-vendor: Ex Libris
    x-surface-class: LibraryCatalog
    description: >-
      The University of Sydney Library runs on the Ex Libris Alma library services platform with
      the Primo VE discovery layer, on the institution-specific tenant
      sydney.primo.exlibrisgroup.com (view id 61USYD_INST:sydney). The catalog data is the
      university's; the API contract is Ex Libris's, published on the Ex Libris Developer Network
      and gated behind vendor-issued institution API keys. Recorded as a tenant relationship. No
      Ex Libris specification has been saved under this slug — it belongs to Ex Libris.
    humanURL: https://sydney.primo.exlibrisgroup.com/
    tags: [ Library, Discovery, Alma, Primo, Tenant, Vendor Contract ]
    properties:
      - type: Documentation
        url: https://developers.exlibrisgroup.com/
  - aid: university-of-sydney:canvas-lms
    name: Canvas LMS (tenant)
    x-operator: tenant
    x-vendor: Instructure
    x-surface-class: LearningManagement
    description: >-
      canvas.sydney.edu.au is a vanity hostname on the university's own domain that CNAMEs to
      sydney-vanity.instructure.com, and it redirects unauthenticated visitors into the
      university's Okta tenant with a SAMLRequest. The learning-management contract, including the
      Canvas LMS REST API and its LTI tool registration, is Instructure's. The vanity hostname does
      not make it the university's engineering. Recorded as a tenant relationship; no Canvas
      specification has been saved under this slug.
    humanURL: https://canvas.sydney.edu.au/
    tags: [ Learning Management, Canvas, LMS, Tenant, Vendor Contract, LTI ]
