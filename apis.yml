x-coverage:
  state: gated
  reason: no_public_developer_program
  detail: >-
    The University of Sydney operates real institutional surfaces but publishes none of them for
    third-party consumption. The one machine-readable artifact it serves openly is SAML 2.0
    identity-provider metadata, which is consumable only by federation members. Its institutional
    repository documents an OAI-PMH interface on its own host but answers 403 to every automated
    client behind Cloudflare bot management. Its course catalog is HTML only. Its student portal
    APIs require a session. Its MuleSoft Anypoint production gateway resolves in DNS but filters
    TCP 443 from the public internet. Its library, LMS and sign-in run on Ex Libris, Instructure
    and Okta tenants whose contracts belong to those vendors. No OpenAPI, no developer portal, no
    credential self-service, no llms.txt and no security.txt were found — sydney.edu.au serves a
    soft-404 (HTTP 200 redirecting to /errors/404.html) for both well-known paths, so neither is
    credited. This is a correct thin profile, not a failed harvest.
  generated: '2026-08-19'
  method: probed
