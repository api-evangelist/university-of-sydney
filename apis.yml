aid: university-of-sydney
name: University of Sydney
x-type: university
x-category: Public Research University
description: >-
  The University of Sydney is Australia's first university, founded in 1850, a Group of Eight
  member and ranked in the QS world top 40. Its programmable footprint is small, and most of what
  looks like a University of Sydney API is a vendor's contract running under the university's name.
  Re-profiled on 2026-08-19 with operator attribution settled first, the institution operates no
  public developer portal, publishes no OpenAPI, and offers no self-service developer credential.
  The only openly machine-readable artifact served under a University of Sydney hostname is
  SAML 2.0 federation metadata at federation.sydney.edu.au — and even that is a tenant surface,
  because the host CNAMEs to the Australian Access Federation's hosted Rapid IdP. The entity,
  scope and signing key are the university's; the infrastructure is AAF's. Beyond that it operates the Sydney eScholarship
  institutional repository (a DataCite repository client with 2,146 DOIs, whose documented OAI-PMH
  endpoint is currently behind Cloudflare bot management), the CUSP course and unit-of-study
  catalog as HTML only, the myUni student portal on session-gated internal JSON endpoints, and a
  MuleSoft Anypoint API gateway at api.sydney.edu.au whose production load balancer resolves in
  DNS but refuses connections from the public internet. Its library discovery, learning management
  and identity brokering all run on vendor platforms — Ex Libris Primo/Alma, Instructure Canvas and
  Okta — where the data is the university's and the contract is not. An earlier profile of this
  cohort risked attributing a Figshare repository here; sydney.figshare.com was checked and is not
  the University of Sydney's, and no Figshare contract has been saved under this slug.
