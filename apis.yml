  - aid: university-of-sydney:escholarship-repository
    name: Sydney eScholarship Repository (institutional repository, OAI-PMH)
    x-operator: institution
    x-surface-class: ResearchRepository
    description: >-
      Sydney eScholarship is the university's own institutional repository, running on the
      university-owned usyd.edu.au domain (usyd.edu.au redirects to www.sydney.edu.au). It is a
      registered DataCite repository client — ARDCX.USYD, "Sydney eScholarship", registered 2020,
      2,146 DOIs minted, administered from @sydney.edu.au addresses — which settles the operator
      question as the institution rather than a vendor. It documents a standard OAI-PMH 2.0
      harvesting interface at /oai/request, but on 2026-08-19 that endpoint and every other path
      on the host returned HTTP 403 behind Cloudflare bot management to default, browser and
      XML-accepting clients alike; robots.txt on the same host returned 200 and permits
      /handle/2123/ with a 30-second crawl delay, so the host is live and bot-blocked, not dead.
      OAI-PMH conformance is therefore recorded as claimed and unverified.
    humanURL: https://ses.library.usyd.edu.au/
    baseURL: https://ses.library.usyd.edu.au/oai/request
    tags: [ Research Repository, OAI-PMH, DataCite, DSpace, Open Access, Metadata, Bot-Blocked ]
    properties:
      - type: Documentation
        url: https://www.library.sydney.edu.au/support/publishing/publishing-research-data
      - type: Conformance
        url: conformance/university-of-sydney-education-standards.yml
      - type: Registry
        url: https://api.datacite.org/clients/ardcx.usyd
  - aid: university-of-sydney:cusp-course-catalog
    name: CUSP — Course & Unit of Study Portal
    x-operator: institution
    x-surface-class: CourseCatalog
    description: >-
      CUSP is the University of Sydney's own course and unit-of-study catalog, served from
      cusp.sydney.edu.au behind Cloudflare and cross-linked from the sydney.edu.au course and unit
      finders. It is the registrar-facing surface a course-catalog API would normally sit on, and
      it is institution-operated — but it is HTML only. No JSON, XML or feed representation was
      found; the sydney.edu.au course search that fronts it is powered by a hosted Coveo index,
      not by a published university endpoint. Recorded as an institution surface with no
      machine-readable contract.
    humanURL: https://cusp.sydney.edu.au/
    tags: [ Course Catalog, Registrar, Curriculum, HTML Only, Students ]
