        (CNAME to idp-cname.aaf.edu.au, CloudFront + ALB + Jetty 12.1.0, Amazon-issued cert),
        so the operator is tenant even though the hostname is the institution's.
    - url: https://md.aaf.edu.au/aaf-metadata.xml
