reviews:
  - date: '2026-08-19'
    rating: 2
    summary: >-
      Re-profiled under the API Evangelist university pipeline with operator attribution settled
      before any artifact was saved. Findings: the only openly machine-readable artifact served
      under a University of Sydney hostname is Shibboleth SAML 2.0 identity-provider metadata at
      federation.sydney.edu.au (200, application/xml, registered in the Australian Access Federation
      and republished into eduGAIN) — and that is a TENANT surface, because the host CNAMEs to
      d007b274....idp-cname.aaf.edu.au and answers from CloudFront + an AWS ALB running Jetty 12.1.0
      under an Amazon-issued certificate: AAF's hosted Rapid IdP. The entity, scope and SAML signing
      key are the university's; the software is not. It is also a DataCite repository
      client (ARDCX.USYD, Sydney eScholarship, 2,146 DOIs) and a Crossref member (12184, The
      University of Sydney Library, prefix 10.30722, 654 DOIs), which settles the institutional
      repository as institution-operated rather than a vendor's. Its documented OAI-PMH endpoint
      is behind Cloudflare bot management and returned 403 to every automated client tried, so
      OAI-PMH conformance is recorded as claimed and unverified rather than credited. api.sydney.edu.au
      resolves to a MuleSoft Anypoint production load balancer (usyd-lb-p.lb.anypointdns.net) but
      filters TCP 443 — a real API program that is not a public one. Library discovery, LMS and
      sign-in are tenants on Ex Libris, Instructure and Okta; those contracts are not the
      university's and none were saved here. sydney.figshare.com was checked and REJECTED — it is
      a Figshare wildcard host, not a University of Sydney repository; the Sydney-region Figshare
      customer is UTS. llms.txt and .well-known/security.txt on sydney.edu.au are soft-404s (200
      redirecting to /errors/404.html) and are not credited. No OpenAPI, no developer portal, no
      credential self-service. This is a correct thin profile.
