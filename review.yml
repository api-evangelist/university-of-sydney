  - date: '2026-06-03'
    rating: 2
    summary: >-
      No central public developer portal or openly documented API program was
      found for the University of Sydney. Verified live: the official website,
      the Primo discovery layer, the myUni student portal, and the ServiceNow
      service portal all returned HTTP 200. The library runs on Ex Libris Alma
      and Primo, whose APIs require an institution-issued key. The Sydney
      eScholarship Repository OAI-PMH endpoint is documented but returned HTTP
      403 to automated requests (bot-blocked, not necessarily dead). The myUni
      student APIs are authenticated and gated. The Sydney Informatics Hub
      GitHub org is real (research/training code, not API products); the usyd
      GitHub org exists but is private. No endpoints were fabricated; all rows
      below were probed directly.
